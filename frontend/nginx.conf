server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Upload-Größe: 250 MB (Backend erlaubt 200 MB, hier etwas mehr Puffer)
    client_max_body_size 250M;

    # Timeouts für langsame Uploads großer Dateien
    client_body_timeout 300s;
    client_header_timeout 60s;
    send_timeout 300s;

    # API Requests an Backend weiterleiten
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy-Timeouts (wichtig für große Uploads oder lange 3MF-Extraktion)
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Nicht buffern - direkter Stream zum Backend
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
